<!DOCTYPE html> 
<html lang="zh-CN">
<head>

    <title>{% block title %}错题本{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    {% block head %}{% endblock %}
</head>
<body>

     <nav class = "navbar navbar-dark bg-dark">

            <a class="navbar-brand" href="/">🐛 错题本</a>
            <a class="nav-link text-light" href="/list">查看全部</a>

     <!-- 主体內容 -->

        <!-- 页脚 -->

            <small>Python 六级错题本 · 2026</small>
