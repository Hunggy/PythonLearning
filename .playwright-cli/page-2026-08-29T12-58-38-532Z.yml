            - paragraph [ref=f12e183]: 家庭记录
            - paragraph [ref=f12e184]
            - paragraph [ref=f12e185]: 假设有一个任务是帮助你的家庭记录每日的支出。每天结束时，你会记录下今天的日期、购买的物品以及花费的金额。这个信息将被保存在一个名为ledger.txt的文本文件中。编写一段Python代码来完成以下的操作：
            - paragraph [ref=f12e186]
            - paragraph [ref=f12e187]: （1）在文件末尾追加新的消费记录；
            - paragraph [ref=f12e188]: （2）需要查看当前所有的消费记录。
            - paragraph [ref=f12e189]: 为了简化问题，假设每条记录只包含日期、物品和金额，使用逗号分隔。
            - paragraph [ref=f12e190]
            - paragraph [ref=f12e191]: "def append_record(date, item, amount):"
            - paragraph [ref=f12e192]: "with open(\"ledger.txt\", \" ① \") as file:"
            - paragraph [ref=f12e193]: "file.write(f\"{date},{item},{amount}\\n\")"
            - paragraph [ref=f12e194]: "def read_records():"
            - paragraph [ref=f12e195]: "with open(\" ② \", \"r\") as file:"
            - paragraph [ref=f12e196]: records = file. ③ ()
            - paragraph [ref=f12e197]: "for record in records:"
            - paragraph [ref=f12e198]: print(record, end="")
            - paragraph [ref=f12e199]: "# 示例操作"
            - paragraph [ref=f12e200]: append_record("2023-04-05", "Groceries", 35.20)
            - paragraph [ref=f12e201]: append_record("2023-04-06", "Internet Bill", 50)
            - paragraph [ref=f12e202]: ④ ()
